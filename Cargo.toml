[package]
name = "admixrs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Estimate admixture proportions from consumer SNP genotypes"
include = ["src/**", "tests/*.rs", "data/*.F", "data/*.alleles", "data/demo_genome_23andme.txt", "data/README.md", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
